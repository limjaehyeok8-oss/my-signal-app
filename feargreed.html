<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공포탐욕지수</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; color: #222; }
    a.back { font-size: 14px; color: #1565c0; text-decoration: none; }
    h2 { margin: 8px 0 12px; }
    .tabs { display: flex; gap: 8px; }
    .tabs button { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; background: #f5f5f5; border-radius: 6px; }
    .tabs button.on { background: #222; color: #fff; border-color: #222; }
    #msg { margin: 16px 0; color: #666; font-size: 14px; }
    #card { display: none; margin-top: 16px; }
    #score { font-size: 64px; font-weight: bold; text-align: center; line-height: 1.1; }
    #label { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 14px; }
    .bar { position: relative; display: flex; height: 14px; border-radius: 7px; overflow: visible; margin: 22px 0 4px; }
    .bar .seg { height: 100%; }
    .bar .seg:first-child { border-radius: 7px 0 0 7px; }
    .bar .seg:last-of-type { border-radius: 0 7px 7px 0; }
    #marker { position: absolute; top: -12px; width: 0; height: 0; margin-left: -7px;
              border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 11px solid #222; }
    .legend { display: flex; font-size: 10px; color: #888; text-align: center; }
    .legend span { box-sizing: border-box; padding: 0 1px; }
    .cmp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 18px 0; }
    .cmp div { background: #f7f7f7; border-radius: 8px; padding: 8px 4px; text-align: center; }
    .cmp small { display: block; color: #888; font-size: 11px; }
    .cmp b { display: block; font-size: 20px; margin: 2px 0; }
    .cmp em { font-style: normal; font-size: 11px; }
    h3 { margin: 22px 0 6px; font-size: 16px; }
    svg#spark { width: 100%; height: 120px; display: block; border-radius: 6px; background: #fafafa; }
    .ind { margin: 10px 0; }
    .ind .top { display: flex; justify-content: space-between; font-size: 14px; }
    .ind small { color: #888; font-size: 11px; display: block; }
    .ind .track { height: 6px; background: #eee; border-radius: 3px; margin-top: 4px; }
    .ind .fill { height: 6px; border-radius: 3px; }
    #meta { margin-top: 20px; font-size: 12px; color: #999; line-height: 1.6; }
  </style>
</head>
<body>
  <a class="back" href="./">← 보유 종목</a>
  <h2>😨 공포탐욕지수</h2>
  <div class="tabs">
    <button id="tabStock" class="on">주식 (CNN)</button>
    <button id="tabCrypto">코인</button>
  </div>
  <div id="msg">불러오는 중...</div>

  <div id="card">
    <div id="score"></div>
    <div id="label"></div>
    <div class="bar" id="bar"><div id="marker"></div></div>
    <div class="legend" id="legend"></div>

    <div class="cmp" id="cmp"></div>

    <h3>최근 추이</h3>
    <svg id="spark" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>

    <div id="indBox">
      <h3>세부 지표 7가지</h3>
      <div id="inds"></div>
    </div>

    <div id="meta"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyjHP1DGPoYL9njJb_ok6WnpKTUaLUObZjFwqLGa8JJR8mS5roAqb6F0h_MAobuVSTz-g/exec";

    // 구간: 0~24 극단적 공포 / 25~44 공포 / 45~55 중립 / 56~75 탐욕 / 76~100 극단적 탐욕
    const LEVELS = [
      { max: 24,  text: "극단적 공포", color: "#d32f2f", width: 25 },
      { max: 44,  text: "공포",       color: "#f57c00", width: 20 },
      { max: 55,  text: "중립",       color: "#9e9e9e", width: 11 },
      { max: 75,  text: "탐욕",       color: "#7cb342", width: 20 },
      { max: 100, text: "극단적 탐욕", color: "#2e7d32", width: 24 }
    ];
    function levelOf(score) {
      for (const l of LEVELS) if (score <= l.max) return l;
      return LEVELS[LEVELS.length - 1];
    }

    const $ = (id) => document.getElementById(id);
    let data = null, current = "stock";

    function el(tag, props, children) {
      const e = document.createElement(tag);
      if (props) Object.assign(e, props);
      (children || []).forEach((c) => e.appendChild(c));
      return e;
    }

    function buildBar() {
      const bar = $("bar"), legend = $("legend");
      bar.querySelectorAll(".seg").forEach((n) => n.remove());
      legend.textContent = "";
      LEVELS.forEach((l) => {
        const seg = el("div", { className: "seg" });
        seg.style.width = l.width + "%"; seg.style.background = l.color;
        bar.insertBefore(seg, $("marker"));
        const sp = el("span", { textContent: l.text });
        sp.style.width = l.width + "%";
        legend.appendChild(sp);
      });
    }

    function drawSpark(history) {
      const svg = $("spark");
      svg.textContent = "";
      const NS = "http://www.w3.org/2000/svg";
      const bands = [[0, 25, "#d32f2f"], [25, 45, "#f57c00"], [45, 56, "#9e9e9e"], [56, 76, "#7cb342"], [76, 100, "#2e7d32"]];
      bands.forEach(([a, b, c]) => {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", 0); r.setAttribute("width", 300);
        r.setAttribute("y", 100 - b); r.setAttribute("height", b - a);
        r.setAttribute("fill", c); r.setAttribute("opacity", "0.12");
        svg.appendChild(r);
      });
      if (!history || history.length < 2) return;
      const pts = history.map((p, i) => (i / (history.length - 1) * 300).toFixed(1) + "," + (100 - p.v).toFixed(1));
      const line = document.createElementNS(NS, "polyline");
      line.setAttribute("points", pts.join(" "));
      line.setAttribute("fill", "none");
      line.setAttribute("stroke", "#222");
      line.setAttribute("stroke-width", "1.5");
      line.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(line);
    }

    function render() {
      const d = data[current];
      const card = $("card");
      if (!d) {
        card.style.display = "none";
        $("msg").textContent = (current === "stock" ? "주식" : "코인") + " 지수를 불러오지 못했어요. " +
          ((data.errors || []).join(" / "));
        return;
      }
      $("msg").textContent = "";
      card.style.display = "block";

      const lv = levelOf(d.score);
      $("score").textContent = Math.round(d.score);
      $("score").style.color = lv.color;
      $("label").textContent = lv.text;
      $("label").style.color = lv.color;
      $("marker").style.left = Math.min(100, Math.max(0, d.score)) + "%";

      const cmp = $("cmp");
      cmp.textContent = "";
      [["어제", d.prev.day], ["1주 전", d.prev.week], ["1개월 전", d.prev.month], ["1년 전", d.prev.year]].forEach(([name, v]) => {
        const box = el("div");
        box.appendChild(el("small", { textContent: name }));
        if (v == null) {
          box.appendChild(el("b", { textContent: "-" }));
        } else {
          const l = levelOf(v);
          const b = el("b", { textContent: Math.round(v) }); b.style.color = l.color;
          const em = el("em", { textContent: l.text }); em.style.color = l.color;
          box.appendChild(b); box.appendChild(em);
        }
        cmp.appendChild(box);
      });

      drawSpark(d.history);

      const indBox = $("indBox"), inds = $("inds");
      inds.textContent = "";
      if (d.indicators && d.indicators.length) {
        indBox.style.display = "block";
        d.indicators.forEach((i) => {
          const l = levelOf(i.score);
          const top = el("div", { className: "top" }, [
            el("span", { textContent: i.name }),
            (() => { const s = el("b", { textContent: Math.round(i.score) + " · " + l.text }); s.style.color = l.color; return s; })()
          ]);
          const fill = el("div", { className: "fill" });
          fill.style.width = Math.min(100, Math.max(0, i.score)) + "%"; fill.style.background = l.color;
          inds.appendChild(el("div", { className: "ind" }, [
            top, el("small", { textContent: i.desc }), el("div", { className: "track" }, [fill])
          ]));
        });
      } else {
        indBox.style.display = "none";
      }

      const when = d.asOf ? new Date(d.asOf).toLocaleString("ko-KR") : "";
      $("meta").textContent = (current === "stock"
        ? "출처: CNN Fear & Greed Index (S&P 500 등 7개 지표 종합)"
        : "출처: alternative.me Crypto Fear & Greed Index (비트코인 기준)") +
        (when ? " · 기준 " + when : "") +
        " · 투자 판단의 참고용이며 30분마다 갱신돼요.";
    }

    function setTab(name) {
      current = name;
      $("tabStock").className = name === "stock" ? "on" : "";
      $("tabCrypto").className = name === "crypto" ? "on" : "";
      if (data) render();
    }
    $("tabStock").onclick = () => setTab("stock");
    $("tabCrypto").onclick = () => setTab("crypto");

    async function load() {
      buildBar();
      try {
        const res = await fetch(GAS_URL + "?action=fearGreed");
        const r = await res.json();
        if (!r.ok) { $("msg").textContent = "불러오기 실패: " + (r.msg || "알 수 없는 오류"); return; }
        data = r;
        if (!data.stock && data.crypto) setTab("crypto"); else render();
      } catch (e) {
        $("msg").textContent = "오류: " + e.message;
      }
    }
    load();
  </script>
</body>
</html>
