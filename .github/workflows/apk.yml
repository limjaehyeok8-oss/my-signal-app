name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 러너에 안드로이드 SDK가 이미 깔려 있어서, 약관 동의 파일만 넣어 줘요
      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$SDK/licenses/android-sdk-license" >/dev/null
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$SDK/licenses/android-sdk-preview-license" >/dev/null
          echo "sdk.dir=$SDK" > "$RUNNER_TEMP/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 서명 키를 저장해 두어야 나중에 업데이트 APK를 덮어 설치할 수 있어요
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: signal-apk-keystore-v1

      - name: Create Android project
        run: |
          set -e
          SITE="https://limjaehyeok8-oss.github.io/my-signal-app/"
          mkdir -p twa/app/src/main/res/mipmap-xxxhdpi twa/app/src/main/res/values
          cd twa
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "signal"
          include ":app"
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT
          cat > gradle.properties <<'EOT'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOT
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
            namespace 'io.github.limjaehyeok8.signal'
            compileSdk 34
            defaultConfig {
              applicationId 'io.github.limjaehyeok8.signal'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          dependencies {
            implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOT
          cat > app/src/main/res/values/strings.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">주식 알리미</string>
            <string name="asset_statements">[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://limjaehyeok8-oss.github.io\"}}]</string>
          </resources>
          EOT
          cat > app/src/main/AndroidManifest.xml <<EOT
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <meta-data android:name="asset_statements" android:resource="@string/asset_statements"/>
              <activity android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                        android:exported="true">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="$SITE"/>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOT
          cp ../icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build
        working-directory: twa
        run: |
          cp "$RUNNER_TEMP/local.properties" local.properties
          gradle assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp twa/app/build/outputs/apk/debug/app-debug.apk signal.apk
          # APK 파일 자체에서 서명 지문을 읽어요 (키 파일 위치와 상관없이 동작)
          FP=$(keytool -printcert -jarfile signal.apk 2>&1 | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d '[:space:]' || true)
          if [ -z "$FP" ]; then
            FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android 2>&1 | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d '[:space:]' || true)
          fi
          echo "서명 지문: $FP"
          if [ -z "$FP" ]; then echo "지문을 못 읽었어요"; keytool -printcert -jarfile signal.apk || true; exit 1; fi
          cat > assetlinks.json <<EOT
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.github.limjaehyeok8.signal",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          EOT
          gh release delete apk -y --cleanup-tag || true
          gh release create apk signal.apk assetlinks.json --title "안드로이드 앱 (APK)" --notes "주식 알리미 안드로이드 설치 파일 + 주소창 제거용 확인 파일(assetlinks.json)" --latest
