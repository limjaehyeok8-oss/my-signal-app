name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check google-services.json
        run: |
          test -f google-services.json || { echo "저장소 맨 위에 google-services.json 파일이 없어요. Firebase에서 안드로이드 앱을 등록하고 받은 파일을 올려 주세요."; exit 1; }
          grep -q "io.github.limjaehyeok8.signal" google-services.json || { echo "google-services.json 안에 패키지 이름 io.github.limjaehyeok8.signal 이 없어요. Firebase에서 앱을 등록할 때 이 이름으로 등록해야 해요."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 러너에 안드로이드 SDK가 이미 깔려 있어서, 약관 동의 파일만 넣어 줘요
      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$SDK/licenses/android-sdk-license" >/dev/null
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$SDK/licenses/android-sdk-preview-license" >/dev/null
          echo "sdk.dir=$SDK" > "$RUNNER_TEMP/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 서명 키를 저장해 두어야 나중에 업데이트 APK를 덮어 설치할 수 있어요
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: signal-apk-keystore-v1

      - name: Create Android project
        run: |
          set -e
          mkdir -p twa
          cd twa
          PKG_DIR=app/src/main/java/io/github/limjaehyeok8/signal
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/values app/src/main/res/drawable $PKG_DIR
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "signal"
          include ":app"
          EOT
          cat > build.gradle <<'EOT'
          plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOT
          cat > gradle.properties <<'EOT'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOT
          cat > app/build.gradle <<'EOT'
          plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
          }
          android {
            namespace 'io.github.limjaehyeok8.signal'
            compileSdk 34
            defaultConfig {
              applicationId 'io.github.limjaehyeok8.signal'
              minSdk 23
              targetSdk 34
              versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              versionName '2.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          dependencies {
            implementation platform('com.google.firebase:firebase-bom:33.1.2')
            implementation 'com.google.firebase:firebase-messaging'
          }
          EOT
          cp ../google-services.json app/google-services.json
          cat > app/src/main/res/values/strings.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">주식 알리미</string></resources>
          EOT
          cat > app/src/main/res/drawable/ic_stat.xml <<'EOT'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M3,17l6,-6 4,4 8,-8 -1.5,-1.5 -6.5,6.5 -4,-4 -7.5,7.5z"/>
          </vector>
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:allowBackup="true"
                android:usesCleartextTraffic="false"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat"/>
              <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="sig"/>
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                        android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".MyFcmService" android:exported="false">
                <intent-filter>
                  <action android:name="com.google.firebase.MESSAGING_EVENT"/>
                </intent-filter>
              </service>
            </application>
          </manifest>
          EOT
          cp ../icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > $PKG_DIR/MainActivity.java <<'EOT'
          package io.github.limjaehyeok8.signal;

          import android.Manifest;
          import android.app.Activity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.google.firebase.messaging.FirebaseMessaging;

          public class MainActivity extends Activity {
            static final String HOME = "https://limjaehyeok8-oss.github.io/my-signal-app/";
            WebView wv;
            ValueCallback<Uri[]> fileCb;

            static void makeChannel(Context c) {
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel("sig", "주식 알림", NotificationManager.IMPORTANCE_HIGH);
                ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).createNotificationChannel(ch);
              }
            }

            static String targetUrl(Intent i) {
              String u = i == null ? null : i.getStringExtra("url");
              return (u != null && u.startsWith(HOME)) ? u : HOME;
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              makeChannel(this);
              wv = new WebView(this);
              setContentView(wv);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(false);
              s.setUserAgentString(s.getUserAgentString() + " SignalApp/2");
              wv.addJavascriptInterface(new Bridge(), "AndroidApp");
              wv.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("limjaehyeok8-oss.github.io".equals(u.getHost())) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
              });
              wv.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  try { startActivityForResult(p.createIntent(), 7); } catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              FirebaseMessaging.getInstance().getToken().addOnCompleteListener(t -> {
                if (t.isSuccessful() && t.getResult() != null)
                  getSharedPreferences("sig", 0).edit().putString("tok", t.getResult()).apply();
              });
              if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
              wv.loadUrl(targetUrl(getIntent()));
            }

            @Override protected void onNewIntent(Intent i) {
              super.onNewIntent(i);
              setIntent(i);
              wv.loadUrl(targetUrl(i));
            }

            @Override protected void onActivityResult(int req, int res, Intent data) {
              if (req == 7 && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                fileCb = null;
              }
            }

            @Override public void onBackPressed() {
              if (wv.canGoBack()) wv.goBack(); else super.onBackPressed();
            }

            class Bridge {
              @JavascriptInterface public String getToken() { return getSharedPreferences("sig", 0).getString("tok", ""); }
              @JavascriptInterface public boolean notifGranted() {
                return ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).areNotificationsEnabled();
              }
              @JavascriptInterface public void askNotif() {
                runOnUiThread(() -> {
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                });
              }
              @JavascriptInterface public void openSettings() {
                runOnUiThread(() -> {
                  Intent i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                  i.putExtra(Settings.EXTRA_APP_PACKAGE, getPackageName());
                  startActivity(i);
                });
              }
            }
          }
          EOT
          cat > $PKG_DIR/MyFcmService.java <<'EOT'
          package io.github.limjaehyeok8.signal;

          import android.app.Notification;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class MyFcmService extends FirebaseMessagingService {
            @Override public void onNewToken(String t) {
              getSharedPreferences("sig", 0).edit().putString("tok", t).apply();
            }

            @Override public void onMessageReceived(RemoteMessage m) {
              String title = "주식 알리미", body = "";
              if (m.getNotification() != null) {
                if (m.getNotification().getTitle() != null) title = m.getNotification().getTitle();
                if (m.getNotification().getBody() != null) body = m.getNotification().getBody();
              } else {
                if (m.getData().get("title") != null) title = m.getData().get("title");
                if (m.getData().get("body") != null) body = m.getData().get("body");
              }
              String url = m.getData().get("url");
              Intent i = new Intent(this, MainActivity.class);
              i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              if (url != null) i.putExtra("url", url);
              int id = (int) (System.currentTimeMillis() % 100000000);
              PendingIntent pi = PendingIntent.getActivity(this, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              MainActivity.makeChannel(this);
              Notification.Builder nb = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "sig") : new Notification.Builder(this);
              nb.setSmallIcon(R.drawable.ic_stat).setContentTitle(title).setContentText(body)
                .setStyle(new Notification.BigTextStyle().bigText(body)).setContentIntent(pi).setAutoCancel(true);
              ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).notify(id, nb.build());
            }
          }
          EOT

      - name: Build
        working-directory: twa
        run: |
          cp "$RUNNER_TEMP/local.properties" local.properties
          gradle assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp twa/app/build/outputs/apk/debug/app-debug.apk signal.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk signal.apk --title "안드로이드 앱 (APK)" --notes "주식 알리미 안드로이드 앱" --latest
