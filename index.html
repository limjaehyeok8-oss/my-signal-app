<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>타점 알림</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    button { padding: 12px 20px; font-size: 16px; }
    #status { margin-top: 16px; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>📈 주식 타점 알림</h2>
  <button id="subscribe">알림 받기</button>
  <p id="status"></p>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyADLXkO8UqJ048mG2HQCFJNmoL-xAcXY5c",
      authDomain: "mysignalpush.firebaseapp.com",
      projectId: "mysignalpush",
      storageBucket: "mysignalpush.firebasestorage.app",
      messagingSenderId: "224309937152",
      appId: "1:224309937152:web:0e79104fb7aea5b86dc4e5"
    };
    const VAPID_KEY = "BEFQ2PtyXgvk_Bs3t5pNx_A-a4hYtAC3Zk2X6Nguvb-eF3NfC5uBa5SJVQ3ooAWbzhlL2a7k9vK8pAmaStGSPOE";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyjHP1DGPoYL9njJb_ok6WnpKTUaLUObZjFwqLGa8JJR8mS5roAqb6F0h_MAobuVSTz-g/exec";

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();
    const statusEl = document.getElementById("status");
    const log = (m) => statusEl.textContent = m;

    document.getElementById("subscribe").onclick = async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return log("알림 권한이 거부됐어요. 브라우저 설정에서 허용해 주세요.");

        const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
        await navigator.serviceWorker.ready;

        const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
        if (!token) return log("토큰 발급 실패");

        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "register", token })
        });
        const result = await res.json();
        log("등록 결과: " + result.msg);
      } catch (e) {
        log("오류: " + e.message);
      }
    };

    messaging.onMessage(async (payload) => {
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(payload.notification.title, { body: payload.notification.body });
    });
  </script>
</body>
</html>
