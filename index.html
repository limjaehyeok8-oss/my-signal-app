<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 보유 종목 알림</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
    button { padding: 10px 16px; font-size: 15px; }
    input { padding: 10px; font-size: 15px; box-sizing: border-box; }
    #symbol { flex: 1; min-width: 0; }
    #avg { width: 140px; }
    .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    #results { border: 1px solid #ddd; border-radius: 6px; margin-top: 4px; display: none; }
    #results div { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; }
    #results div:last-child { border-bottom: none; }
    #results div:hover { background: #f5f5f5; }
    #results small { color: #888; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px 4px; text-align: right; border-bottom: 1px solid #ddd; font-size: 14px; }
    th:first-child, td:first-child { text-align: left; }
    table.pf th, table.pf td { font-size: 12px; padding: 7px 2px; }
    td.sym { color: #1565c0; text-decoration: underline; cursor: pointer; }
    .up { color: #d32f2f; } .down { color: #1976d2; }
    #status { margin: 12px 0; color: #555; }
    #analysis, #pfBox { display: none; margin-top: 16px; }
    #chartImg, .pfImg { display: block; width: 100%; border-radius: 6px; }
    #chartImg { display: none; }
    #analysisText { white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.5; margin-top: 8px; }
    .pfWrap { margin-top: 12px; }
    .pfCap { font-size: 12px; color: #888; margin-bottom: 4px; }
    #pfInfo { font-size: 14px; color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>📈 내 보유 종목 알림</h2>
  <p><a href="feargreed.html">😨 공포탐욕지수 보기</a></p>
  <button id="toggle">알림 받기</button>
  <p id="status"></p>

  <div id="holdingsBox" style="display:none">
    <h3>종목 검색 · 분석</h3>
    <div class="row">
      <input id="symbol" placeholder="이름 또는 티커 (예: sandisk, SOXL)" autocomplete="off" autocapitalize="off">
      <button id="analyze">분석</button>
    </div>
    <div id="results"></div>

    <div id="analysis">
      <img id="chartImg" alt="차트">
      <pre id="analysisText"></pre>
    </div>

    <h3>보유 종목 등록</h3>
    <div class="row">
      <input id="avg" placeholder="평단가" type="number" step="any" inputmode="decimal">
      <button id="add">위 종목 추가</button>
    </div>
    <p style="font-size:13px;color:#777">검색창의 종목이 등록돼요. 같은 티커를 다시 추가하면 평단가가 수정됩니다. 목록의 티커를 누르면 분석을 볼 수 있어요.</p>

    <div class="row" style="justify-content:space-between">
      <h3 style="margin:12px 0 0">내 보유 종목</h3>
      <button id="pfBtn">📋 포트폴리오</button>
    </div>
    <table>
      <thead><tr><th>종목</th><th>평단</th><th>현재가</th><th>수익률</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>

    <div id="pfBox">
      <h3>📋 포트폴리오 현황</h3>
      <table class="pf">
        <thead><tr><th>종목</th><th>현재가</th><th>평단</th><th>수익률</th><th>점수</th><th>추매</th><th>추세</th></tr></thead>
        <tbody id="pfBody"></tbody>
      </table>
      <p id="pfInfo"></p>
      <div id="pfCharts"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyADLXkO8UqJ048mG2HQCFJNmoL-xAcXY5c",
      authDomain: "mysignalpush.firebaseapp.com",
      projectId: "mysignalpush",
      storageBucket: "mysignalpush.firebasestorage.app",
      messagingSenderId: "224309937152",
      appId: "1:224309937152:web:0e79104fb7aea5b86dc4e5"
    };
    const VAPID_KEY = "BEFQ2PtyXgvk_Bs3t5pNx_A-a4hYtAC3Zk2X6Nguvb-eF3NfC5uBa5SJVQ3ooAWbzhlL2a7k9vK8pAmaStGSPOE";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyjHP1DGPoYL9njJb_ok6WnpKTUaLUObZjFwqLGa8JJR8mS5roAqb6F0h_MAobuVSTz-g/exec";

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();
    const statusEl = document.getElementById("status");
    const toggleBtn = document.getElementById("toggle");
    const log = (m) => statusEl.textContent = m;
    let myToken = null;
    let paused = false;

    async function api(body) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body)
      });
      return res.json();
    }

    async function getMyToken() {
      const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
      await navigator.serviceWorker.ready;
      return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    }

    function fmt(n) { return n == null ? "-" : Number(n).toFixed(2); }

    // ---------- 알림 켜기/끄기 ----------
    function renderToggle() {
      if (!myToken) { toggleBtn.textContent = "알림 받기"; return; }
      toggleBtn.textContent = paused ? "알림 켜기" : "알림 끄기";
      log(paused ? "알림이 꺼져 있어요 (보유 종목은 그대로 남아 있어요)" : "알림이 켜져 있어요");
    }

    toggleBtn.onclick = async () => {
      if (!myToken) {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return log("알림 권한이 거부됐어요. 브라우저 설정에서 허용해 주세요.");
        return init();
      }
      toggleBtn.disabled = true;
      try {
        const r = await api({ action: "setPaused", token: myToken, paused: !paused });
        if (r.ok) { paused = r.paused; renderToggle(); }
        else log(r.msg);
      } catch (e) { log("오류: " + e.message); }
      toggleBtn.disabled = false;
    };

    // ---------- 종목 분석 (텍스트 + 차트) ----------
    let analyzeSeq = 0;
    async function analyze(symbol) {
      symbol = String(symbol || "").trim().toUpperCase();
      if (!symbol) return log("종목을 입력하거나 검색해서 선택하세요");
      const seq = ++analyzeSeq;
      const box = document.getElementById("analysis");
      const img = document.getElementById("chartImg");
      const pre = document.getElementById("analysisText");
      box.style.display = "block";
      img.style.display = "none";
      pre.textContent = symbol + " 분석 중... (10초 정도 걸려요)";
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });
      try {
        const r = await api({ action: "analyze", token: myToken, ticker: symbol });
        if (seq !== analyzeSeq) return;
        if (!r.ok) { pre.textContent = r.msg || "분석에 실패했어요"; return; }
        if (r.image) { img.src = "data:image/png;base64," + r.image; img.style.display = "block"; }
        pre.textContent = r.text;
      } catch (e) {
        if (seq === analyzeSeq) pre.textContent = "오류: " + e.message;
      }
    }

    // ---------- 종목 검색 ----------
    const symbolEl = document.getElementById("symbol");
    const resultsEl = document.getElementById("results");
    let searchTimer = null;
    let searchSeq = 0;

    function hideResults() { resultsEl.style.display = "none"; resultsEl.textContent = ""; }

    symbolEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      const q = symbolEl.value.trim();
      if (!q) return hideResults();
      searchTimer = setTimeout(async () => {
        const seq = ++searchSeq;
        try {
          const r = await api({ action: "search", token: myToken, query: q });
          if (seq !== searchSeq) return;
          resultsEl.textContent = "";
          if (!r.ok || !r.results.length) {
            const none = document.createElement("div");
            none.textContent = r.ok ? "검색 결과가 없어요" : r.msg;
            resultsEl.appendChild(none);
          } else {
            r.results.forEach((item) => {
              const div = document.createElement("div");
              const b = document.createElement("b");
              b.textContent = item.symbol;
              const small = document.createElement("small");
              small.textContent = "  " + item.name + " · " + item.exchange;
              div.appendChild(b); div.appendChild(small);
              div.onclick = () => { symbolEl.value = item.symbol; hideResults(); analyze(item.symbol); };
              resultsEl.appendChild(div);
            });
          }
          resultsEl.style.display = "block";
        } catch (e) { hideResults(); }
      }, 350);
    });

    symbolEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { hideResults(); analyze(symbolEl.value); }
    });
    document.getElementById("analyze").onclick = () => { hideResults(); analyze(symbolEl.value); };

    // ---------- 보유 종목 ----------
    async function loadHoldings() {
      const r = await api({ action: "listHoldings", token: myToken });
      const tbody = document.getElementById("list");
      tbody.textContent = "";
      if (!r.ok) return log(r.msg);
      r.holdings.forEach((h) => {
        const tr = document.createElement("tr");

        const symTd = document.createElement("td");
        symTd.className = "sym";
        symTd.textContent = h.symbol;
        symTd.onclick = () => { symbolEl.value = h.symbol; analyze(h.symbol); };
        tr.appendChild(symTd);

        [fmt(h.avgPrice), fmt(h.price)].forEach((t) => {
          const td = document.createElement("td"); td.textContent = t; tr.appendChild(td);
        });

        const pnlTd = document.createElement("td");
        if (h.pnl != null) {
          pnlTd.textContent = (h.pnl >= 0 ? "+" : "") + h.pnl.toFixed(1) + "%";
          pnlTd.className = h.pnl >= 0 ? "up" : "down";
        } else pnlTd.textContent = "-";
        tr.appendChild(pnlTd);

        const delTd = document.createElement("td");
        const del = document.createElement("button");
        del.textContent = "삭제";
        del.onclick = async () => {
          const x = await api({ action: "removeHolding", token: myToken, symbol: h.symbol });
          log(x.msg); loadHoldings();
        };
        delTd.appendChild(del); tr.appendChild(delTd);
        tbody.appendChild(tr);
      });
    }

    // ---------- 포트폴리오 (표 + 종목별 차트) ----------
    let pfSeq = 0;
    const pfBtn = document.getElementById("pfBtn");

    async function loadPortfolio() {
      const seq = ++pfSeq;
      const box = document.getElementById("pfBox");
      const body = document.getElementById("pfBody");
      const charts = document.getElementById("pfCharts");
      const info = document.getElementById("pfInfo");
      box.style.display = "block";
      body.textContent = "";
      charts.textContent = "";
      info.textContent = "포트폴리오 불러오는 중... (종목당 몇 초씩 걸려요)";
      pfBtn.disabled = true;
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });

      try {
        const r = await api({ action: "portfolio", token: myToken });
        if (seq !== pfSeq) return;
        if (!r.ok) { info.textContent = r.msg; return; }
        if (!r.rows.length) { info.textContent = "등록된 종목이 없어요"; return; }

        r.rows.forEach((row) => {
          const tr = document.createElement("tr");
          const add = (text, cls) => {
            const td = document.createElement("td");
            td.textContent = text;
            if (cls) td.className = cls;
            tr.appendChild(td);
            return td;
          };
          add(row.symbol);
          if (row.error) {
            for (let i = 0; i < 5; i++) add("-");
            add("조회 실패");
          } else {
            add(fmt(row.price));
            add(fmt(row.avgPrice));
            if (row.pnl != null) add((row.pnl >= 0 ? "+" : "") + row.pnl.toFixed(1) + "%", row.pnl >= 0 ? "up" : "down");
            else add("-");
            add((row.score >= 0 ? "+" : "") + row.score);
            add(row.buyZone ? fmt(row.buyZone) : "-");
            const dotUp = row.pnl != null ? row.pnl >= 0 : row.trendUp;
            add((row.trendUp ? "UP " : "DOWN ") + (dotUp ? "🟢" : "🔴"));
          }
          body.appendChild(tr);
        });
        info.textContent = r.avgPnl != null
          ? "평균 수익률: " + (r.avgPnl >= 0 ? "+" : "") + r.avgPnl.toFixed(1) + "%"
          : "";

        // 종목별 차트를 하나씩 이어서 불러옴
        for (const row of r.rows) {
          if (row.error) continue;
          if (seq !== pfSeq) return;
          const wrap = document.createElement("div");
          wrap.className = "pfWrap";
          const cap = document.createElement("div");
          cap.className = "pfCap";
          cap.textContent = row.symbol + " 차트 생성 중...";
          wrap.appendChild(cap);
          charts.appendChild(wrap);
          try {
            const a = await api({ action: "analyze", token: myToken, ticker: row.symbol });
            if (seq !== pfSeq) return;
            if (a.ok && a.image) {
              cap.textContent = row.symbol;
              const img = document.createElement("img");
              img.className = "pfImg";
              img.alt = row.symbol + " 차트";
              img.src = "data:image/png;base64," + a.image;
              wrap.appendChild(img);
            } else {
              cap.textContent = row.symbol + " 차트를 만들지 못했어요";
            }
          } catch (e) {
            cap.textContent = row.symbol + " 차트 오류";
          }
        }
      } catch (e) {
        if (seq === pfSeq) info.textContent = "오류: " + e.message;
      } finally {
        if (seq === pfSeq) pfBtn.disabled = false;
      }
    }
    pfBtn.onclick = loadPortfolio;

    async function init() {
      try {
        myToken = await getMyToken();
        if (!myToken) return log("토큰 발급 실패");
        const r = await api({ action: "register", token: myToken });
        if (!r.ok) return log(r.msg);
        paused = r.paused === true;
        renderToggle();
        document.getElementById("holdingsBox").style.display = "block";
        loadHoldings();
      } catch (e) { log("오류: " + e.message); }
    }

    document.getElementById("add").onclick = async () => {
      const symbol = symbolEl.value.trim();
      const avg = document.getElementById("avg").value;
      if (!symbol) return log("종목을 검색하거나 티커를 입력하세요");
      hideResults();
      log("등록 중...");
      const r = await api({ action: "addHolding", token: myToken, symbol: symbol, avgPrice: avg });
      log(r.msg);
      if (r.ok) { document.getElementById("avg").value = ""; loadHoldings(); }
    };

    if (Notification.permission === "granted") init();

    messaging.onMessage(async (payload) => {
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(payload.notification.title, { body: payload.notification.body });
    });
  </script>
</body>
</html>
